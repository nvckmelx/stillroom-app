<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060c11">
<meta name="color-scheme" content="dark">
<title>Stillroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap">
<style>
/* Layout: procedural world full-bleed (Codex motion studies), centred hero with a glass play pill,
   translucent category switcher on top, the content itself swipes between tracks. Phone first. */
:root{
  --bg:#060c11;
  --ink:#edf0ea;
  --quiet:#9ca9aa;
  --dim:#708583;
  --line:rgba(214,228,220,.13);
  --glass:rgba(166,200,199,.05);
  --glass-hi:rgba(178,197,200,.12);
  --accent:#aec7b6;
  --f-ui:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
body{overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid #c5d9d4;outline-offset:4px}
svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.3;fill:none;flex:none}

#stage{position:relative;height:100%;isolation:isolate;overflow:hidden;container:stage/size}
#world{position:absolute;inset:0;z-index:-3}
.readability{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,rgba(2,8,14,.30),transparent 55%),linear-gradient(0deg,rgba(4,10,16,.86),transparent 42%),linear-gradient(180deg,rgba(4,10,16,.5),transparent 18%)}
.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.91' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.5' filter='url(%23n)'/%3E%3C/svg%3E")}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 8px}
.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:400;letter-spacing:-.7px}
.mark{width:24px;height:24px;position:relative;flex:none}
.mark::before,.mark::after{content:"";position:absolute;inset:3px;border:1px solid #a9bdb7;border-radius:50%}
.mark::after{inset:8px 0 0 8px;border-color:#a9bdb770}
.actions{display:flex;align-items:center;gap:8px}
.icon-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 13px;border:1px solid var(--line);border-radius:30px;
  background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:11.5px;color:#d7e1dc;transition:background .2s,border-color .2s}
.icon-button:active,.icon-button:hover{background:var(--glass-hi)}
.icon-button.square{width:36px;padding:0}
.timer-left{font-variant-numeric:tabular-nums;color:var(--quiet)}

.hero{display:grid;place-content:center;justify-items:center;text-align:center;padding:12px 20px 18px;touch-action:pan-y;overflow:hidden}
.eyebrow{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#b4c3bd;margin:0 0 18px;display:flex;gap:12px;align-items:center}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:#bacdc13d}
h1{font-weight:200;font-size:clamp(44px,13cqw,80px);letter-spacing:-.065em;line-height:1.05;margin:0 0 12px;text-shadow:0 2px 30px #050a0c60;text-wrap:balance;max-width:11ch}
.description{font-size:13.5px;font-weight:300;color:#c4d0cb;letter-spacing:.03em;margin:0}
.meta{font-size:10.5px;font-weight:400;color:var(--dim);letter-spacing:.06em;margin:8px 0 0;max-width:34ch;line-height:1.5}
.swap{transition:opacity .4s ease,transform .5s ease}
.swap.out{opacity:0;transform:translateY(5px)}

.hero{cursor:pointer}
.hero:focus-visible{outline:none}
.hint{margin:30px 0 0;display:inline-flex;align-items:center;gap:10px;height:20px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#b4c3bd;
  transition:opacity .8s ease;animation:breathe 4.5s ease-in-out infinite}
.playing .hint{opacity:.55;animation:none}
.playing .hint.fade{opacity:0}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
.tap-ring{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid rgba(220,235,226,.35);border-radius:50%;pointer-events:none;z-index:3;
  animation:ring .9s ease-out forwards}
@keyframes ring{from{transform:scale(.2);opacity:.8}to{transform:scale(1.4);opacity:0}}
.bars{display:none;align-items:flex-end;gap:2px;height:12px}
.bars i{display:block;width:2px;height:4px;border-radius:1px;background:var(--accent)}
.playing .bars{display:flex}
.playing .bars i{animation:eq 1.3s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.35s}.bars i:nth-child(3){animation-delay:-.75s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* category switcher: translucent segmented control with a sliding glass pill */
.tabs{position:relative;display:flex;margin:6px 18px 0;padding:4px;border:1px solid #ccddd51a;border-radius:30px;
  background:rgba(3,11,16,.22);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);touch-action:pan-y}
.glider{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:24px;pointer-events:none;
  background:linear-gradient(120deg,rgba(220,235,224,.13),rgba(198,227,219,.05));box-shadow:inset 0 0 0 1px rgba(211,228,215,.14),0 4px 18px rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .55s cubic-bezier(.22,.8,.2,1),width .55s cubic-bezier(.22,.8,.2,1)}
.tabs.dragging .glider{transition:none}
.tab{position:relative;z-index:1;flex:1;border-radius:24px;padding:9px 4px;color:rgba(200,214,212,.55);font-size:11px;white-space:nowrap;transition:color .45s ease,opacity .45s ease}
.tab[aria-selected="true"]{color:#e8efea}

/* track carousel: the content itself slides */
.slide{display:grid;justify-items:center;will-change:transform,opacity}
.slide.anim{transition:transform .34s cubic-bezier(.3,.7,.3,1),opacity .34s ease}
.dots{display:flex;gap:6px;justify-content:center;margin-top:18px;height:4px}
.dots i{display:block;width:4px;height:4px;border-radius:2px;background:rgba(214,228,220,.28);transition:width .45s cubic-bezier(.22,.8,.2,1),background .45s}
.dots i.on{width:16px;background:rgba(232,240,234,.85)}

footer{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;padding:12px 20px 0;color:var(--dim);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}

.ui{transition:opacity .55s,visibility .55s}
.clean .ui{opacity:0;visibility:hidden;pointer-events:none}
.restore{position:absolute;right:18px;top:calc(18px + env(safe-area-inset-top,0px));z-index:5;opacity:0;visibility:hidden;transition:opacity .3s}
.clean .restore{opacity:.75;visibility:visible}
.clean-tap{position:absolute;inset:0;z-index:4;display:none}
.clean .clean-tap{display:block}

@container stage (min-width:700px){
  header{padding:30px 40px 8px}
  .tabs{justify-self:center;width:min(520px,calc(100% - 80px));margin-inline:0}
  footer{padding-inline:42px}
  .description{font-size:14.5px}
}
@container stage (max-height:640px){
  h1{font-size:44px}.eyebrow{margin-bottom:10px}.hint{margin-top:16px}.meta{display:none}
}
@media (prefers-reduced-motion:reduce){
  .swap,.ui{transition:none}.playing .bars i,.hint,.tap-ring{animation:none}
  .slide.anim,.glider,.dots i{transition:none}
}
</style>
</head>
<body>
<main id="stage">
  <div id="world" aria-hidden="true"></div><div class="readability"></div><div class="grain"></div>
  <div class="app">
    <header class="ui">
      <div class="brand"><span class="mark" aria-hidden="true"></span>stillroom</div>
      <div class="actions">
        <button class="icon-button" id="timer" type="button" aria-label="Sleep timer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <span class="timer-left" id="timerLabel">Timer</span>
        </button>
        <button class="icon-button square" id="hide" type="button" aria-label="Hide interface">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs ui" role="tablist" id="tabs" aria-label="Sound categories"><span class="glider" id="glider" aria-hidden="true"></span></nav>

    <section class="hero ui" id="hero" role="button" tabindex="0" aria-label="Play" aria-describedby="title">
      <div class="slide" id="slide">
        <p class="eyebrow" id="eyebrow">A little room to breathe</p>
        <h1 id="title">Stress relief</h1>
        <p class="description" id="description">Let the weight fall away</p>
        <p class="meta" id="meta">432 Hz tuning · one swell every 10 s</p>
      </div>
      <p class="hint" id="hint"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="hintText">Tap to listen</span></p>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </section>

    <footer class="ui"><span id="counter">01 / 11</span><span>Swipe to explore · Headphones for binaural</span></footer>
  </div>
  <div class="clean-tap" id="cleanTap" aria-hidden="true"></div>
  <button class="icon-button restore" id="restore" type="button" aria-label="Show interface">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 12h16M4 16h16"/></svg>Show
  </button>
</main>

  return '#'+[f(h+1/3),f(h),f(h-1/3)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')}

function impulse(sec,decay){const n=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,n,ac.sampleRate);

  for(let c=0;c<2;c++){const d=b.getChannelData(c);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;
      if(type==='white')d[i]=w*.5;
      else if(type==='pink'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
      else if(type==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.2}

function createScene(item){

  S.out=ac.createGain();S.out.gain.setValueAtTime(0,now);S.out.gain.linearRampToValueAtTime(1,now+2.5);S.out.connect(master);

  if(item.bed){ // Suno bed under an exact binaural / Hz tone

    const ms=ac.createMediaElementSource(el),bg=ac.createGain();bg.gain.value=.5;ms.connect(bg);bg.connect(S.out);S.el=el;S.hasBed=true;el.play().catch(()=>{});
  }

    const el=new Audio();el.crossOrigin='anonymous';el.loop=true;el.src=item.track;
    const ms=ac.createMediaElementSource(el);ms.connect(S.out);S.el=el;S.isTrack=true;
    el.play().catch(()=>{});el.addEventListener('error',()=>{if(!S.dead){S.isTrack=false;buildGenerator(S,now);updateStatus()}},{once:true});

function buildGenerator(S,now){
  const it=S.item;

    const p=it.p;S.chords=p.chords.map(c=>c.map(n=>hzOf(p.root+n,p.tune)));S.dur=p.dur;S.wave=p.wave;S.padLv=p.pad;
    S.nextChord=now+.05;S.ci=0;S.nextPl=now+(p.pl?.type==='bowl'?1.5:2);S.nextArp=now+1;S.ai=0;S.nextDrum=now+.2;S.si=0;S.nextBird=now+3;

    const L=ac.createOscillator(),R=ac.createOscillator();L.frequency.value=it.carrier;R.frequency.value=it.carrier+it.beat;
    L.connect(m,0,0);R.connect(m,0,1);m.connect(g);g.connect(S.out);L.start();R.start();S.srcs.push(L,R);
    S.filter.frequency.value=600;S.chords=[[it.carrier/2,it.carrier*.75]];S.dur=14;S.wave='sine';S.padLv=S.hasBed?.04:.16;S.nextChord=now+.05;S.ci=0;
    addNoise(S,'pink',.035);S.tick=padOnlyTick;
  } else if(it.kind==='tone'){
    const f=it.f,lv=.15*Math.sqrt(300/Math.max(f,300)),g=ac.createGain();g.gain.value=lv;
    const o=ac.createOscillator();o.frequency.value=f;o.connect(g);g.connect(S.out);o.start();S.srcs.push(o,lfo(.1,lv*.35,g.gain));
    const sg=ac.createGain();sg.gain.value=.05;const o2=ac.createOscillator();o2.frequency.value=f/2;o2.connect(sg);sg.connect(S.out);o2.start();S.srcs.push(o2);

    S.filter.frequency.value=900;S.chords=[[b,b*1.5,b*2],[b,b*1.5,b*3]];S.dur=14;S.wave='triangle';S.padLv=.26;S.nextChord=now+.05;S.ci=0;S.tick=padOnlyTick;

}
function addNoise(S,type,lv){
  const g=ac.createGain();g.gain.value=lv;g.connect(S.out);
  const chain=(s,...nodes)=>{let n=s;nodes.forEach(x=>{n.connect(x);n=x});n.connect(g);S.srcs.push(s)};
  const bq=(t,f,q=.7)=>{const b=ac.createBiquadFilter();b.type=t;b.frequency.value=f;b.Q.value=q;return b};
  if(type==='white'||type==='pink'||type==='brown')chain(src(type),bq('lowpass',type==='white'?12000:9000));
  else if(type==='rain'){chain(src('white'),bq('highpass',900),bq('lowpass',6500),bq('peaking',3200));S.srcs.push(lfo(.17,lv*.12,g.gain))}

  else if(type==='wind'){const f=bq('bandpass',520,1.4);chain(src('pink'),f);S.srcs.push(lfo(.05,320,f.frequency),lfo(.08,lv*.5,g.gain))}

    const o=ac.createOscillator();o.frequency.value=4650;const a=ac.createGain();a.gain.value=.5;const b=ac.createGain();b.gain.value=.5;

function padChord(S,freqs,t,dur){

const PLUCK={soft:{p:[[1,1],[2,.15]],a:.03,d:3.5},bell:{p:[[1,1],[2.76,.32],[5.4,.1]],a:.004,d:4.2},

/* ---------------- UI (Codex motion-studies design) ---------------- */
const $=id=>document.getElementById(id);
const INTRO={moods:'A little room to breathe',binaural:'A quieter state of mind',freq:'Find your own resonance',nature:'Closer to the natural world'};
// Our style ids → Codex background preset ids
const BG_ALIAS={relaxation:'deep-relaxation',lofi:'lo-fi-chill',spa:'spa-yoga',morning:'gentle-morning','forest-night':'forest'};
const bgId=i=>BG_ALIAS[i.id]||(i.kind==='tone'?'hz-'+i.f:i.id);
const BGP=Object.fromEntries(StillroomBackgrounds.presets.map(p=>[p.id,p]));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const inGroup=g=>ITEMS.filter(i=>i.g===g);
const lastInGroup={};GROUPS.forEach(g=>lastInGroup[g.id]=inGroup(g.id)[0]);
let current=ITEMS[0],clean=false;
const engine=StillroomBackgrounds.mount($('world'),{preset:bgId(current),maxDpr:1.5,transitionDuration:1800,frozen:true});

/* ---- category switcher (top) ---- */
GROUPS.forEach(g=>{const b=document.createElement('button');b.className='tab';b.type='button';b.dataset.g=g.id;
  b.setAttribute('role','tab');b.textContent=g.label;b.onclick=()=>{if(tabDrag.suppress){tabDrag.suppress=false;return}goGroup(g.id)};$('tabs').appendChild(b)});
function placeGlider(offset=0){
  const on=$('tabs').querySelector(`.tab[data-g="${current.g}"]`);if(!on)return;
  $('glider').style.width=on.offsetWidth+'px';$('glider').style.transform=`translateX(${on.offsetLeft+offset}px)`;
  $('tabs').querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b===on));
}
function goGroup(gid,dir){
  if(gid===current.g)return;
  const gi=GROUPS.findIndex(g=>g.id===gid),ci=GROUPS.findIndex(g=>g.id===current.g);
  select(lastInGroup[gid],dir||(gi>ci?1:-1));
}
function stepGroup(d){const ci=GROUPS.findIndex(g=>g.id===current.g);goGroup(GROUPS[(ci+d+GROUPS.length)%GROUPS.length].id,d)}
const tabDrag={x:0,y:0,on:false,moved:false,suppress:false};
$('tabs').addEventListener('pointerdown',e=>{Object.assign(tabDrag,{x:e.clientX,y:e.clientY,on:true,moved:false})});
$('tabs').addEventListener('pointermove',e=>{if(!tabDrag.on)return;const dx=e.clientX-tabDrag.x,dy=e.clientY-tabDrag.y;
  if(!tabDrag.moved&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){tabDrag.moved=true;$('tabs').classList.add('dragging');try{$('tabs').setPointerCapture(e.pointerId)}catch(_){}}
  if(tabDrag.moved)placeGlider(Math.max(-60,Math.min(60,-dx*.35)))});
function endTabDrag(e){if(!tabDrag.on)return;tabDrag.on=false;$('tabs').classList.remove('dragging');
  if(tabDrag.moved){tabDrag.suppress=true;setTimeout(()=>tabDrag.suppress=false,50);const dx=e.clientX-tabDrag.x;if(Math.abs(dx)>40)stepGroup(dx<0?1:-1);else placeGlider()}}
$('tabs').addEventListener('pointerup',endTabDrag);$('tabs').addEventListener('pointercancel',e=>{tabDrag.on=false;$('tabs').classList.remove('dragging');placeGlider()});
addEventListener('resize',()=>placeGlider());

/* ---- content: the slide carries the track; swipe it to move through the category ---- */
function fill(item){
  $('eyebrow').textContent=INTRO[item.g];$('title').textContent=item.name;
  $('description').textContent=(BGP[bgId(item)]||{}).description||item.chip;$('meta').textContent=item.meta;
  const list=inGroup(item.g),idx=list.indexOf(item);
  $('dots').replaceChildren(...list.map((_,k)=>{const d=document.createElement('i');if(k===idx)d.className='on';return d}));
  $('counter').textContent=String(idx+1).padStart(2,'0')+' / '+String(list.length).padStart(2,'0');
}
let slideTimer=0;
function slideTo(item,dir){
  const el=$('slide');clearTimeout(slideTimer);
  if(reduceMotion||!dir){el.className='slide';el.style.transform='';el.style.opacity='';fill(item);return}
  el.className='slide anim';el.style.transform=`translateX(${-dir*70}px)`;el.style.opacity='0';
  slideTimer=setTimeout(()=>{fill(item);el.className='slide';el.style.transform=`translateX(${dir*70}px)`;el.style.opacity='0';
    void el.offsetWidth;el.className='slide anim';el.style.transform='translateX(0)';el.style.opacity='1'},300);
}
function select(item,dir){
  if(item===current&&dir!==0)return;
  current=item;lastInGroup[item.g]=item;engine.setPreset(bgId(item));slideTo(item,dir);placeGlider();
  try{history.replaceState(null,'','#'+item.id)}catch(e){}
  store.set('stillroom.item',item.id);
  if(playing){stopScene(scene);scene=createScene(item)}
  updateStatus();mediaMeta();
}
function step(d){const list=inGroup(current.g),i=list.indexOf(current);select(list[(i+d+list.length)%list.length],d)}

const drag={x:0,y:0,on:false,moved:false};
const hero=$('hero');
hero.addEventListener('pointerdown',e=>{if(e.button>0)return;Object.assign(drag,{x:e.clientX,y:e.clientY,on:true,moved:false})});
hero.addEventListener('pointermove',e=>{if(!drag.on)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag.moved=true;try{hero.setPointerCapture(e.pointerId)}catch(_){}}
  if(drag.moved){const el=$('slide');el.className='slide';el.style.transform=`translateX(${dx*.65}px)`;el.style.opacity=String(Math.max(.15,1-Math.abs(dx)/260))}});
hero.addEventListener('pointerup',e=>{if(!drag.on)return;drag.on=false;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(drag.moved){if(Math.abs(dx)>60)step(dx<0?1:-1);else{const el=$('slide');el.className='slide anim';el.style.transform='translateX(0)';el.style.opacity='1'}return}
  if(Math.abs(dx)<10&&Math.abs(dy)<10){ripple(e);toggle()}});
hero.addEventListener('pointercancel',()=>{drag.on=false;const el=$('slide');el.className='slide anim';el.style.transform='translateX(0)';el.style.opacity='1'});
hero.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();toggle()}});
function ripple(e){const r=document.createElement('span');r.className='tap-ring';const b=$('stage').getBoundingClientRect();
  r.style.left=(e.clientX-b.left)+'px';r.style.top=(e.clientY-b.top)+'px';$('stage').appendChild(r);setTimeout(()=>r.remove(),1000)}

/* ---- playback ---- */
let hintTimer=0;
function updateStatus(){
  $('stage').classList.toggle('playing',playing);engine.setFrozen(!playing);
  hero.setAttribute('aria-label',playing?'Pause':'Play');
  $('hintText').textContent=playing?'Tap to pause':'Tap to listen';
  const h=$('hint');h.classList.remove('fade');clearTimeout(hintTimer);if(playing)hintTimer=setTimeout(()=>h.classList.add('fade'),3500);
}
function play(){
  if(!ac)initAudio();ac.resume();
  master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(vol*vol,ac.currentTime,.05);
  playing=true;scene=createScene(current);updateStatus();
  try{navigator.mediaSession.playbackState='playing'}catch(e){}
}
function pause(){playing=false;stopScene(scene);scene=null;updateStatus();try{navigator.mediaSession.playbackState='paused'}catch(e){}}
function toggle(){playing?pause():play()}

// Sleep timer: off → 15 → 30 → 60 → 90 min; fades out over the last 30 s
const TIMES=[0,15,30,60,90];let ti=0,timerEnd=0,fading=false;
$('timer').onclick=()=>{ti=(ti+1)%TIMES.length;timerEnd=TIMES[ti]?Date.now()+TIMES[ti]*60000:0;fading=false;
  if(ac&&playing&&!timerEnd){master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(vol*vol,ac.currentTime,.1)}
  tickTimer();if(TIMES[ti]&&!playing)play()};
function tickTimer(){
  if(!timerEnd){$('timerLabel').textContent='Timer';return}
  const left=Math.max(0,timerEnd-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
  $('timerLabel').textContent=m+':'+String(s).padStart(2,'0');
  if(ac&&playing&&left<30000&&!fading){fading=true;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);master.gain.linearRampToValueAtTime(0,ac.currentTime+left/1000)}
  if(left===0){timerEnd=0;ti=0;fading=false;if(playing)pause();$('timerLabel').textContent='Timer'}
}
setInterval(tickTimer,1000);

// Immersive mode: hide everything but the world; tap anywhere to come back
function setClean(v){clean=v;$('stage').classList.toggle('clean',v);document.querySelectorAll('.ui').forEach(el=>el.inert=v)}
$('hide').onclick=()=>setClean(true);$('restore').onclick=()=>setClean(false);$('cleanTap').onclick=()=>setClean(false);

document.addEventListener('keydown',e=>{
  if(e.altKey||e.metaKey||e.ctrlKey)return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowDown')stepGroup(1);else if(e.key==='ArrowUp')stepGroup(-1);
  else if(e.key.toLowerCase()==='h')setClean(!clean);else if(e.key==='Escape'&&clean)setClean(false);
});
function mediaMeta(){try{
  navigator.mediaSession.metadata=new MediaMetadata({title:current.name,artist:'Stillroom',album:GROUPS.find(g=>g.id===current.g).label});
  navigator.mediaSession.setActionHandler('play',play);navigator.mediaSession.setActionHandler('pause',pause);
  navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
}catch(e){}}

/* ---------------- Boot ---------------- */
(function boot(){
  const v=parseFloat(store.get('stillroom.vol'));if(!isNaN(v))vol=v;
  const id=(location.hash||'').slice(1)||store.get('stillroom.item');
  const found=ITEMS.find(i=>i.id===id||bgId(i)===id)||ITEMS[0];
  current=null;select(found,0);
  $('glider').style.transition='none';placeGlider();void $('glider').offsetWidth;$('glider').style.transition='';
  (document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>placeGlider());
})();
</script>
